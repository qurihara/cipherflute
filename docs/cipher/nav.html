<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#14181f">
<title>Kazutaka Kurihara · CipherFlute v1.0</title>
<style>
  /* The landing page of the name card's QR code (https://unryu.org/q/nc1, 2026-11-22).
     Three links as big buttons. The look follows go.html. */
  :root { --bg:#14181f; --card:#1d232d; --ink:#eef1f5; --mute:#9aa4b2; --line:#2c3442; --accent:#7fb8ff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; text-align:center; }
  .wrap { width:100%; max-width:420px; }
  .kicker { font-size:1rem; font-weight:600; letter-spacing:.08em; color:var(--mute); margin:0 0 8px; }
  h1 { font-size:1.6rem; font-weight:600; margin:0 0 4px; line-height:1.3; }
  .ja { font-size:.85rem; color:var(--mute); margin:0 0 28px; }
  nav { display:flex; flex-direction:column; gap:14px; }
  nav a { display:block; background:var(--card); color:var(--ink); text-decoration:none;
          border:1px solid #3a4352; border-radius:16px; padding:18px 20px; line-height:1.4;
          transition:border-color .12s, box-shadow .12s, transform .12s; }
  nav a:hover, nav a:focus-visible { border-color:var(--accent); box-shadow:0 0 18px rgba(127,184,255,.35); outline:none; }
  nav a:active { transform:scale(.98); }
  nav a .en { display:block; font-size:1.1rem; font-weight:600; }
  nav a .jp { display:block; font-size:.82rem; color:var(--mute); margin-top:4px; }
  nav a.primary { background:var(--accent); border-color:var(--accent); color:#0b1424; }
  nav a.primary .jp { color:#24364f; }
  .foot { margin-top:28px; font-size:.75rem; color:var(--mute); }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">CipherFlute</p>
  <h1>Kazutaka Kurihara</h1>
  <p class="ja" lang="ja">栗原一貴</p>
  <nav>
    <a class="primary" href="https://www.unryu.org/">
      <span class="en">Kazutaka Kurihara's website</span>
      <span class="jp" lang="ja">栗原一貴のウェブサイト</span>
    </a>
    <a href="https://protopedia.net/prototype/9394">
      <span class="en">CipherFlute on ProtoPedia</span>
      <span class="jp" lang="ja">ProtoPedia の CipherFlute 作品ページ</span>
    </a>
    <a href="https://unryu.org/cipherflute/dapp/#lo=G%236&amp;hi=G7&amp;norepeat=1&amp;mode=symbols&amp;parity=2&amp;cards=1&amp;expect=8&amp;name=namecard">
      <span class="en">Crypto wallet demo</span>
      <span class="jp" lang="ja">暗号通貨ウォレットのサンプル</span>
    </a>
  </nav>
  <p class="foot">CipherFlute · v1.0</p>
</div>
</body>
</html>
